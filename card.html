<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print your crawl card · Hometown Crawls</title>
  <meta name="theme-color" content="#f8f2e7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="stylesheet" href="assets/card-print.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="card-print-page">
    <div class="wrap card-toolbar">
      <p class="eyebrow">Paper card</p>
      <h1>Download &amp; print your card</h1>
      <p class="muted">Print 2-up puts two copies on a letter page. Print one card when you want a single portrait page for a PDF. Shops mark the numbered circles in ink.</p>
      <div class="row mt-2">
        <button class="btn btn-primary" type="button" id="card-print">Print 2-up</button>
        <button class="btn btn-soft" type="button" id="card-print-single">Print one card</button>
        <a class="btn btn-ghost" href="/account">Back to your account</a>
      </div>
      <p class="form-note" id="card-status" role="status"></p>
    </div>
    <div id="card-sheets"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/config.js"></script>
  <script src="assets/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/crawl.js"></script>
  <script src="assets/card-print.js"></script>
</body>
</html>
