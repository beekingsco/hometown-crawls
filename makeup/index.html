<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Makeup stamp · Hometown Crawls</title>
  <meta name="theme-color" content="#f8f2e7" />
  <meta name="description" content="A one-time makeup stamp for a Hometown Crawls passport." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .makeup-shops { display: flex; flex-direction: column; gap: 0.75rem; }
    .makeup-shop {
      width: 100%;
      min-height: 4rem;
      padding: 1rem 1.15rem;
      white-space: normal;
      text-align: left;
      justify-content: flex-start;
      line-height: 1.3;
    }
    .makeup-shop:disabled { opacity: 0.55; cursor: progress; }
    #makeup-next[hidden], #makeup-note[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="wrap-narrow page-hero">
      <p class="eyebrow" id="makeup-kicker">Makeup stamp</p>
      <h1 id="makeup-title">One stamp, on the house</h1>
      <p id="makeup-copy">Pulling up the shops on your crawl.</p>
    </div>
    <div class="wrap-narrow stack" style="padding-bottom:2.5rem">
      <div id="makeup-shops" class="makeup-shops"></div>
      <p class="form-note" id="makeup-note" hidden></p>
      <p class="form-error" id="makeup-err" role="alert"></p>
      <p id="makeup-next" hidden></p>
      <noscript>
        <p class="card">This page needs JavaScript to add your stamp. Reply to the email and we will help.</p>
      </noscript>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/config.js"></script>
  <script src="/assets/site.js"></script>
  <script src="/assets/makeup.js?v=makeup-1"></script>
</body>
</html>
